name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android runtime and bootstraps
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"

      - name: Install Kotlin compiler
        shell: pwsh
        run: |
          $version = "2.3.21"
          $archive = Join-Path $env:RUNNER_TEMP "kotlin-compiler.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-compiler-$version.zip" `
            -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "a8cfc1d62cd4d0de4d04f42575e40135bd620588c17d568a20eb9c7c259af14f"
          if ($actual -ne $expected) { throw "Kotlin compiler checksum mismatch." }
          $tools = Join-Path $env:RUNNER_TEMP "kotlin"
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          Get-ChildItem (Join-Path $tools "kotlinc/bin") -File | ForEach-Object {
            & chmod +x $_.FullName
          }
          (Join-Path $tools "kotlinc/bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build NDK runtime and Java/Kotlin bootstraps
        shell: pwsh
        run: ./scripts/build_android.ps1 -Configuration Release

      - name: Upload Android build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/android
          if-no-files-found: error
          retention-days: 3

  host:
    name: Host build (${{ matrix.name }})
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Android build outputs
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: dist/android

      - name: Configure and build fpatch
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release

      - name: Build all host targets
        shell: pwsh
        run: cmake --build build --config Release

      - name: Run host tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
